<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Craque da Banca Sync</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0a0e1a;
      color: #f1f5f9;
      margin: 0;
    }
    h2 { margin-top: 0; font-size: 16px; color: #6366f1; border-bottom: 1px solid #1f2847; padding-bottom: 8px;}
    .btn {
      width: 100%; padding: 10px; margin-top: 10px;
      border: none; border-radius: 8px; font-weight: bold;
      cursor: pointer; transition: 0.2s;
    }
    .btn-extract { background-color: #10b981; color: white; }
    .btn-extract:hover { background-color: #059669; }
    .btn-sync { background-color: #6366f1; color: white; display: none; }
    .btn-sync:hover { background-color: #4f46e5; }
    #status { margin-top: 12px; font-size: 12px; color: #94a3b8; text-align: center; }
    .bet-count { font-size: 24px; font-weight: bold; text-align: center; margin: 10px 0; color: #10b981;}
  </style>
</head>
<body>
  <h2>⚽ Craque da Banca Sync</h2>
  
  <div id="step1">
    <p style="font-size: 13px;">1. Abra a página de apostas resolvidas na Bet365.</p>
    <button id="btn-extract" class="btn btn-extract">Extrair Apostas da Tela</button>
  </div>

  <div id="step2" style="display: none;">
    <p style="font-size: 13px; text-align: center;">Apostas encontradas:</p>
    <div id="bet-count" class="bet-count">0</div>
    <button id="btn-sync" class="btn btn-sync">Enviar para o Painel</button>
  </div>

  <div id="status">Pronto.</div>

  <script src="popup.js"></script>
</body>
</html>
